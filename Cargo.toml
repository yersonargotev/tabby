[package]
name = "tabby"
version = "0.1.13"
edition = "2024"
description = "Herdr plugin for automatic tab labels"
homepage = "https://github.com/yersonargotev/tabby"
repository = "https://github.com/yersonargotev/tabby"
license = "Apache-2.0"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.1.4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
