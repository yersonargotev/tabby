id = "yersonargotev.tabby"
name = "Tabby"
version = "0.1.13"
min_herdr_version = "0.8.0"
description = "Labels the focused tab with a Significant Command or Working Directory Basename."
platforms = ["macos"]

# Canonical plugin-root executable contract. Local development flow:
#   cargo build && python3 scripts/prepare-herdr-plugin.py
#   herdr plugin link .
# Herdr plugin link does not run build commands. GitHub-managed installation runs
# this command before registration and prepares the same stable path.

[[build]]
command = ["python3", "scripts/install-herdr-plugin.py"]

[[startup]]
command = [".herdr/bin/tabby", "ensure-started"]

[[actions]]
id = "start"
title = "Start Tabby"
contexts = ["workspace"]
command = [".herdr/bin/tabby", "start"]

[[actions]]
id = "refresh"
title = "Refresh Tabby Label"
contexts = ["tab", "workspace"]
command = [".herdr/bin/tabby", "refresh"]

[[actions]]
id = "unlock-focused"
title = "Unlock focused tab"
contexts = ["tab"]
command = [".herdr/bin/tabby", "unlock-focused"]

[[actions]]
id = "unlock-all"
title = "Unlock all tabs"
contexts = ["workspace"]
command = [".herdr/bin/tabby", "unlock-all"]

[[events]]
on = "pane.focused"
command = [".herdr/bin/tabby", "signal-focus"]

[[events]]
on = "workspace.created"
command = [".herdr/bin/tabby", "signal-created"]

[[events]]
on = "tab.created"
command = [".herdr/bin/tabby", "signal-created"]
