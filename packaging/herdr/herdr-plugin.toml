id = "yersonargotev.tabby"
name = "Tabby"
version = "0.1.13"
min_herdr_version = "0.8.0"
description = "Labels the focused tab with a Significant Command or Working Directory Suffix."
platforms = ["macos"]

# Release flow:
#   brew install yersonargotev/tap/tabby
#   tabby install
# Homebrew installs this manifest under pkgshare (share/tabby) and the binary under bin.
# Keep the command path relative to this manifest so Herdr invokes the binary installed
# by the same Homebrew package, not target/debug/tabby or an ambiguous PATH lookup.

[[startup]]
command = ["../../bin/tabby", "ensure-started"]

[[actions]]
id = "start"
title = "Start Tabby"
contexts = ["workspace"]
command = ["../../bin/tabby", "start"]

[[actions]]
id = "refresh"
title = "Refresh Tabby Label"
contexts = ["tab", "workspace"]
command = ["../../bin/tabby", "refresh"]

[[actions]]
id = "config-path"
title = "Show Tabby Config Path"
contexts = ["workspace"]
command = ["../../bin/tabby", "config", "path"]

[[actions]]
id = "config-check"
title = "Check Tabby Config"
contexts = ["workspace"]
command = ["../../bin/tabby", "config", "check"]

[[actions]]
id = "config-reload"
title = "Reload Tabby Config"
contexts = ["workspace"]
command = ["../../bin/tabby", "config", "reload"]

[[actions]]
id = "unlock-focused"
title = "Unlock focused tab"
contexts = ["tab"]
command = ["../../bin/tabby", "unlock-focused"]

[[actions]]
id = "unlock-all"
title = "Unlock all tabs"
contexts = ["workspace"]
command = ["../../bin/tabby", "unlock-all"]

[[events]]
on = "pane.focused"
command = ["../../bin/tabby", "signal-focus"]

[[events]]
on = "workspace.created"
command = ["../../bin/tabby", "signal-created"]

[[events]]
on = "tab.created"
command = ["../../bin/tabby", "signal-created"]
