id = "yersonargotev.tabby"
name = "Tabby"
version = "0.1.10"
min_herdr_version = "0.8.0"
description = "Local-link Herdr plugin scaffold for automatic tab labels."
platforms = ["macos"]

# Local development flow:
#   cargo build
#   herdr plugin link .
# Herdr plugin link does not run build commands, so commands target the local debug binary.

[[startup]]
command = ["target/debug/tabby", "ensure-started"]

[[actions]]
id = "start"
title = "Start Tabby"
contexts = ["workspace"]
command = ["target/debug/tabby", "ensure-started"]

[[actions]]
id = "refresh"
title = "Refresh Tabby Label"
contexts = ["tab", "workspace"]
command = ["target/debug/tabby", "refresh"]

[[actions]]
id = "unlock-focused"
title = "Unlock focused tab"
contexts = ["tab"]
command = ["target/debug/tabby", "unlock-focused"]

[[actions]]
id = "unlock-all"
title = "Unlock all tabs"
contexts = ["workspace"]
command = ["target/debug/tabby", "unlock-all"]

[[events]]
on = "pane.focused"
command = ["target/debug/tabby", "signal-focus"]

[[events]]
on = "workspace.created"
command = ["target/debug/tabby", "signal-created"]

[[events]]
on = "tab.created"
command = ["target/debug/tabby", "signal-created"]
